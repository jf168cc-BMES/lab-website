meta:
  title: {en: "Join Us | Nanomedicine & Stem Cell Engineering Lab"}
  description: {en: "How to join the Nanomedicine & Stem Cell Engineering Lab at National Tsing Hua University, Taiwan: positions, funding, key dates, and how to apply."}
heading: {en: "Join Us"}
intro: {en: "We welcome motivated students from around the world. This page explains who we are looking for, how students are funded, and how to apply."}
domestic_note: {en: "台灣學生請看「[加入我們](../zh/join/)」（中文）。"}
updated_label: {en: "Last updated"}
