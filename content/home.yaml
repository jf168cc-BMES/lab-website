pi:   # 「認識張老師」：照片取自 pi.yaml 的 pi.photo_sm，簡介這句話改這裡
  heading: {en: "Meet Prof. Chang", zh: "認識張老師"}
  text:
    en: "Chien-Wen (Jeff) Chang is a Professor and the Chair of the Department of Biomedical Engineering and Environmental Sciences at NTHU. He received his PhD from the University of Utah and did postdoctoral research at UC San Diego and UCLA. His research covers drug and gene delivery and stem cell engineering."
    zh: "張建文教授現任國立清華大學生醫工程與環境科學系教授兼系主任。他在美國猶他大學取得博士學位，之後在加州大學聖地牙哥分校與洛杉磯分校做博士後研究，研究方向包括藥物與基因遞送、幹細胞工程。"
  more: {en: "More about Prof. Chang", zh: "看張老師的簡介"}
