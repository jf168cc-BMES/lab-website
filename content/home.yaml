hero:
  kicker:
    en: "National Tsing Hua University · Hsinchu, Taiwan"
    zh: "國立清華大學 · 生醫工程與環境科學系"
  tagline:
    en: "We engineer nanomaterials and stem cells to deliver genes and drugs, treat cancer, and support tissue repair."
    zh: "我們設計奈米材料、改造幹細胞，用來遞送基因與藥物、治療癌症，也幫助組織修復。"
  recruiting:
    en: "Recruiting international MS and PhD students, TEEP interns, and exchange students"
    zh: "招收專題生、碩士生、博士生，也有研究助理與博後職缺"
