why:
  heading: {en: "Why train with us", zh: "在這裡你會學到什麼"}
  points:
    - title: {en: "Hands-on, interdisciplinary training", zh: "跨領域的實作訓練"}
      text:
        en: "Learn polymer and nanoparticle synthesis, non-viral gene delivery, stem cell culture, and animal disease models in one lab."
        zh: "在同一個實驗室學高分子與奈米粒子合成、非病毒基因遞送、幹細胞培養與動物疾病模式。"
    - title: {en: "An international lab", zh: "國際化的環境"}
      text:
        en: "We run TEEP research programs for international interns and have hosted an exchange student from HCMUT in Vietnam. Our department is listed as an English-taught program on NTHU's international admission website."
        zh: "實驗室執行 TEEP 國際實習計畫，也接待過越南 HCMUT 的交換生。醫環系在清大國際生入學網站上列為英語授課學程。"
    - title: {en: "Recognized work", zh: "研究成果獲獎"}
      text:
        en: "Our work received the National Innovation Award (2020), the National Innovation Excellence Award (2022), the Future Tech Award (2021, 2023), and the Prof. Chau-Jen Lee Research Scholar Award (2026)."
        zh: "研究成果獲得國家新創獎（2020）、國家新創精進獎（2022）、未來科技獎（2021、2023），以及李昭仁教授生醫工程研究學者獎（2026）。"
